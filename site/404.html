<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — FlowCue</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/page.css">
<style>
  .notfound { max-width: 640px; margin: 0 auto; padding: 96px 24px; text-align: center; }
  .notfound .code { font-size: 72px; font-weight: 700; letter-spacing: -0.04em; color: var(--accent); margin: 0 0 8px; }
  .notfound h1 { font-size: 26px; margin: 0 0 12px; }
  .notfound p { color: var(--muted); margin: 0 0 8px; }
  .notfound .links { display: flex; gap: 16px; justify-content: center; margin-top: 28px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="notfound">
  <p class="code">404</p>
  <h1>This page doesn’t exist</h1>
  <p>这个页面不存在，可能是链接过期或拼写有误。</p>
  <div class="links">
    <a href="/">Home / 首页</a>
    <a href="/mac/">Mac</a>
    <a href="/changelog/">Changelog</a>
  </div>
</main>
</body>
</html>
