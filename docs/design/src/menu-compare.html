<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1200px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 700px at 12% 112%,rgba(92,76,190,.16),transparent 70%),
             linear-gradient(158deg,#0C0C10,#08080A 58%,#0A0910);color:#F5F5F7}
.stage{width:1600px;height:1200px;padding:56px 60px;display:flex;flex-direction:column}
.k{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.32)}
h1{font-size:44px;font-weight:600;margin-top:10px}
.sub{font-size:17px;color:rgba(255,255,255,.42);margin-top:10px;line-height:1.55;max-width:1450px}
.body{flex:1;display:flex;align-items:center;justify-content:center;gap:90px;min-height:0}
.col{display:flex;flex-direction:column;align-items:center;gap:20px}
.nm{font-size:20px;font-weight:600}
.nt{font-size:15px;color:rgba(255,255,255,.38);font-family:ui-monospace,Menlo,monospace;text-align:center;line-height:1.6}
.big{width:260px;height:260px;border-radius:32px;background:rgba(255,255,255,.02);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.bar{width:260px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.light{background:#F2F0EA}.dark{background:#1E1E22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:22px;
  border-top:1px solid rgba(255,255,255,.06);font-size:13px;color:rgba(255,255,255,.3);
  font-family:ui-monospace,Menlo,monospace;letter-spacing:.05em}
</style></head>
