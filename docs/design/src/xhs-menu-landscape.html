<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1200px;overflow:hidden}

.nm{font-size:24px;font-weight:600;margin-top:6px}
.nums{font-size:17px;color:rgba(255,255,255,.45);font-family:ui-monospace,Menlo,monospace}
.foot{display:flex;justify-content:space-between;align-items:flex-end;padding-top:24px;
