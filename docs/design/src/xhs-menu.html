<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1440px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 700px at 18% 115%,rgba(92,76,190,.22),transparent 70%),
             linear-gradient(160deg,#0C0C10,#08080A 60%,#0A0910);color:#F5F5F7}
.wrap{width:1080px;height:1440px;padding:84px 90px;display:flex;flex-direction:column}
.k{font-size:19px;letter-spacing:.3em;color:rgba(255,255,255,.36)}
h1{font-size:62px;font-weight:700;letter-spacing:-.02em;margin-top:20px;line-height:1.15}
.sub{font-size:22px;color:rgba(255,255,255,.42);margin-top:18px;line-height:1.55}
.blk{margin-top:54px}
.lbl{font-size:26px;font-weight:600;margin-bottom:18px}
.row{display:flex;gap:44px;align-items:center}
.big{width:300px;height:300px;border-radius:36px;background:rgba(255,255,255,.02);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none}
.bars{flex:1;max-width:420px;display:flex;flex-direction:column;gap:14px}
.bar{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.light{background:#F2F0EA}.dark{background:#1E1E22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.note{font-size:15px;color:rgba(255,255,255,.3);font-family:ui-monospace,Menlo,monospace;margin-top:2px}
.nums{margin-top:14px;font-size:19px;color:rgba(255,255,255,.45);font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:17px;
  color:rgba(255,255,255,.28);letter-spacing:.22em;font-family:ui-monospace,Menlo,monospace}
