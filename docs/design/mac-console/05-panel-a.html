<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>FlowCue · 面板方案 A</title><link rel="stylesheet" href="v2.css"></head>
<body>
<div class="scene" style="grid-template-columns: 1fr; height: 640px; width: 700px">
  <div class="frame">
    <div class="caption">A · 目的地 chip + 两级选择（推荐）</div>
    <div class="floatwrap" style="top: 26%">
      <div class="panel dest" style="margin: 0 auto">
        <div class="top">
          <span class="dest" style="color: var(--text); border-color: var(--stroke-strong)">收件箱 ▾</span>
          <span class="spacer"></span>
          <span class="x">✕</span>
        </div>
        <div class="input">把登录接口的错误码统一一下，顺便补两个测试<span class="dim">｜</span></div>
        <div class="bottom">
          <span class="plus">＋</span>
          <span class="hint">来自 Codex · 修复登录接口</span>
          <span class="spacer"></span>
          <span class="hint">⌘↩ 保存</span>
          <span class="go">↑</span>
        </div>

        <div class="destmenu">
          <div class="col1">
            <div class="h">目的地</div>
            <div class="it"><span class="dot accent"></span>收件箱 <span class="s">默认</span></div>
            <div class="it on"><span class="dot ok"></span>Codex <span class="s">5</span></div>
            <div class="it"><span class="dot"></span>Claude <span class="s">3</span></div>
            <div class="it"><span class="dot"></span>DSH <span class="s">2</span></div>
          </div>
          <div class="col2">
            <div class="h">Codex 会话</div>
            <div class="it on">修复登录接口 <span class="s">12 分</span></div>
            <div class="it">Upwork 项目扫描 <span class="s">3 小时</span></div>
            <div class="it">每日设计情报 <span class="s">1 小时</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
