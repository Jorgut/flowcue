<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>FlowCue · 面板方案 B</title><link rel="stylesheet" href="v2.css"></head>
<body>
<div class="scene" style="grid-template-columns: 1fr; height: 560px; width: 700px">
  <div class="frame">
    <div class="caption">B · Agent 分段 + 来源 / 目标（保守）</div>
    <div class="floatwrap" style="top: 34%">
      <div class="panel compact" style="margin: 0 auto; width: 520px">
        <div class="top">
          <span class="crumb">收件箱</span>
          <span class="spacer"></span>
          <span class="x">✕</span>
        </div>

        <div class="agentseg" style="margin: 2px 0 9px">
          <span>收件箱</span><span class="on">Codex</span><span>Claude</span><span>DSH</span>
        </div>

        <div class="pickrow" style="margin-bottom: 9px">
          <span class="sel">来源　修复登录接口 ▾</span>
          <span>→</span>
          <span class="sel">目标　选择任务 ▾</span>
          <span class="refresh">↻</span>
        </div>

        <div class="input" style="min-height:52px">把登录接口的错误码统一一下，顺便补两个测试<span class="dim">｜</span></div>

        <div class="bottom">
          <span class="plus">＋</span>
          <span class="hint">⌘↩ 保存 · ⌥⌘↩ 排队</span>
          <span class="spacer"></span>
          <span class="hint">Queue in Codex</span>
          <span class="go">↑</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
