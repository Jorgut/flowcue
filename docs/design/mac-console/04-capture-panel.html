<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>FlowCue · 捕获面板两版</title><link rel="stylesheet" href="v2.css"></head>
<body>
<div class="scene">
  <!-- A：自由浮动 -->
  <div class="frame">
    <div class="caption">A · 自由浮动窗口</div>
    <div class="fakewin" style="inset: 70px 44px auto 44px; height: 150px"></div>
    <div class="fakewin second" style="inset: 236px 74px auto 64px; height: 96px; opacity:.55"></div>

    <div class="floatwrap">
      <div class="panel">
        <div class="top">
          <span class="crumb"><span class="dot accent"></span>　收件箱</span>
          <span class="spacer"></span>
          <span class="x">✕</span>
        </div>

        <div class="input">把登录接口的错误码统一一下，顺便补两个测试<span class="dim">｜</span></div>

        <div class="bottom">
          <span class="plus">＋</span>
          <span class="dest">收件箱 ▾</span>
          <span class="spacer"></span>
          <span class="hint">⌘↩ 保存</span>
          <span class="go">↑</span>
        </div>
      </div>
      <div style="text-align:center; font-size:10.5px; color:var(--text-3); margin-top:14px">
        记住位置 · ⌃⌥Space 唤起 · 失焦不消失
      </div>
    </div>
  </div>

  <!-- B：菜单栏 popover -->
  <div class="frame">
    <div class="caption">B · 菜单栏 popover</div>
    <div class="mb">
      <span></span><span>文件</span><span>编辑</span><span>显示</span>
      <span class="right">
        <span class="fc"><span class="dot accent"></span> FlowCue</span>
        <span>Wi‑Fi</span><span>100%</span><span>11月23日 周一 11:06</span>
      </span>
    </div>

    

    <div class="popwrap2" style="left: auto; right: 12px; top: 32px">
      <div class="panel" style="width: 460px">
        <div class="tail"></div>
        <div class="top">
          <span class="crumb"><span class="dot accent"></span>　收件箱</span>
          <span class="spacer"></span>
          <span class="x">✕</span>
        </div>

        <div class="input">每天下班前把当天的决定和待办整理成一条<span class="dim">｜</span></div>

        <div class="bottom">
          <span class="plus">＋</span>
          <span class="dest accent">Codex 任务 ▾</span>
          <span class="spacer"></span>
          <span class="hint">⌘↩ 保存</span>
          <span class="go">↑</span>
        </div>
      </div>
      <div style="text-align:center; font-size:10.5px; color:var(--text-3); margin-top:14px">
        贴着菜单栏出现 · 点外面即收起 · 不抢焦点
      </div>
    </div>
  </div>
</div>
</body>
</html>
