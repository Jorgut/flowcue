<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlowCue — 4:5 card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 620px at 50% 18%, rgba(126,132,255,.20), transparent 65%),
      radial-gradient(540px 420px at 10% 100%, rgba(92,217,184,.06), transparent 60%),
      #0B0B0F;
    color: #F2F2F6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 58px;
    font-size: 19px; font-weight: 650;
  }
  .mark {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(145deg, #A6ABFF, #6A70F0);
    display: grid; place-items: center; color: #0A0A18; font-weight: 700; font-size: 18px;
    box-shadow: 0 8px 22px rgba(126,132,255,.4);
  }
  .beta {
    font-size: 9px; letter-spacing: .14em; color: #9A9AA7;
    border: 1px solid #2A2A35; border-radius: 999px; padding: 4px 7px; margin-left: 4px;
  }
  h1 { margin: 44px 0 0; font-size: 78px; line-height: .97; letter-spacing: -2.8px; font-weight: 700; }
  h1 span {
    background: linear-gradient(100deg, #F2F2F6 12%, #A6ABFF 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 20px auto 0; font-size: 20px; line-height: 1.5; color: #9A9AA7; max-width: 560px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
    font-size: 10px; letter-spacing: .16em; color: #B9BDFF;
    background: rgba(126,132,255,.12); border: 1px solid rgba(126,132,255,.28);
    border-radius: 999px; padding: 8px 12px;
  }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #5CD9B8; box-shadow: 0 0 8px rgba(92,217,184,.7); }
  .glow {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(126,132,255,.22), transparent 62%);
    filter: blur(10px);
  }
  .phone {
    position: absolute; left: 50%; bottom: -120px; transform: translateX(-50%);
    width: 468px; border-radius: 42px; overflow: hidden;
    border: 9px solid #1B1B22; background: #0B0B0F;
    box-shadow: 0 60px 120px rgba(0,0,0,.72), 0 0 0 1px rgba(255,255,255,.08);
  }
  .phone img { display: block; width: 100%; }
  .notch {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 104px; height: 26px; border-radius: 999px; background: #050507; z-index: 2;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand"><div class="mark">↵</div>FlowCue<span class="beta">BETA</span></div>
  <h1>Your agents.<br><span>Every device.</span></h1>
  <p>One console for Codex, Claude and DSH across Mac, Windows PC and phone.</p>
  <div class="pill"><span class="dot"></span>PRE-LAUNCH PREVIEW</div>
  <div class="phone">
    <div class="notch"></div>
    <img src="mobile-1080x1920.png" alt="FlowCue on a phone">
  </div>
</body>
</html>
