name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Validate release scripts
        run: zsh -n Scripts/build-app.sh Scripts/build-app-store-preview.sh Scripts/release-macos.sh

      - name: Render icon assets
        run: swift Scripts/render-flowcue-icon.swift

      - name: Run tests
        run: swift test

      # macOS 只做直下发行，不上架 App Store，因此不再校验 App Store 目标。
      # 如将来要上架，恢复这一步并先补齐 FlowCue.xcodeproj 的文件列表。

      - name: Build app bundle
        run: zsh Scripts/build-app.sh

      - name: Verify bundle
        run: |
          plutil -lint dist/FlowCue.app/Contents/Info.plist
          plutil -lint dist/FlowCue.app/Contents/Resources/PrivacyInfo.xcprivacy
          codesign --verify --deep --strict dist/FlowCue.app
