name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Validate release scripts
        run: zsh -n Scripts/build-app.sh Scripts/build-app-store-preview.sh Scripts/release-macos.sh

      - name: Render icon assets
        run: swift Scripts/render-flowcue-icon.swift

      - name: Run tests
        run: swift test

      - name: Build Mac App Store target
        run: >-
          xcodebuild
          -project FlowCue.xcodeproj
          -scheme FlowCue
          -configuration Release
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build app bundle
        run: zsh Scripts/build-app.sh

      - name: Verify bundle
        run: |
          plutil -lint dist/FlowCue.app/Contents/Info.plist
          plutil -lint dist/FlowCue.app/Contents/Resources/PrivacyInfo.xcprivacy
          codesign --verify --deep --strict dist/FlowCue.app
