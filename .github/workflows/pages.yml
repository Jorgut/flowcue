name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "PAGES_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Pages build triggered."
